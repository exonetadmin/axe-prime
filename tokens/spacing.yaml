# AXE PRIME Design Tokens - Spacing

axe-prime:
  space:
    0:
      value: '0'
    1:
      value: '0.25rem'    # 4px
    2:
      value: '0.5rem'     # 8px
    3:
      value: '0.75rem'    # 12px
    4:
      value: '1rem'       # 16px
    5:
      value: '1.25rem'    # 20px
    6:
      value: '1.5rem'     # 24px
    8:
      value: '2rem'       # 32px
    10:
      value: '2.5rem'     # 40px
    12:
      value: '3rem'       # 48px
    16:
      value: '4rem'       # 64px
    20:
      value: '5rem'       # 80px
    24:
      value: '6rem'       # 96px
  
  container:
    DEFAULT:
      value: 'min(1220px, calc(100vw - 2.5rem))'
      description: 'Main content container'
    narrow:
      value: 'min(920px, calc(100vw - 2.5rem))'
    wide:
      value: 'min(1400px, calc(100vw - 2.5rem))'
  
  radius:
    sm:
      value: '0.375rem'   # 6px
    DEFAULT:
      value: '0.5rem'     # 8px
    md:
      value: '0.75rem'    # 12px
    lg:
      value: '1rem'       # 16px
    xl:
      value: '1.5rem'     # 24px
    '2xl':
      value: '2rem'       # 32px
    full:
      value: '9999px'
