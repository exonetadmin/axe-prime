# AXE PRIME Design Tokens - Typography

axe-prime:
  font:
    family:
      display:
        value: ['Plus Jakarta Sans', 'system-ui', 'sans-serif']
        description: 'Headlines and display text'
      body:
        value: ['Inter', 'system-ui', 'sans-serif']
        description: 'Body text and UI'
      mono:
        value: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
        description: 'Code and numbers'
  
  font-size:
    xs:
      value: '0.75rem'      # 12px
    sm:
      value: '0.875rem'     # 14px
    base:
      value: '1rem'         # 16px
    lg:
      value: '1.125rem'     # 18px
    xl:
      value: '1.25rem'      # 20px
    '2xl':
      value: '1.5rem'       # 24px
    '3xl':
      value: '1.875rem'     # 30px
    '4xl':
      value: '2.25rem'      # 36px
    '5xl':
      value: '3rem'         # 48px
    '6xl':
      value: '3.75rem'      # 60px
  
  font-weight:
    normal:
      value: '400'
    medium:
      value: '500'
    semibold:
      value: '600'
    bold:
      value: '700'
    extrabold:
      value: '800'
  
  line-height:
    tight:
      value: '1.25'
    normal:
      value: '1.5'
    relaxed:
      value: '1.75'
    loose:
      value: '2'
  
  letter-spacing:
    tight:
      value: '-0.025em'
    normal:
      value: '0'
    wide:
      value: '0.025em'
