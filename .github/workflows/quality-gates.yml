name: Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  DATABASE_URL: postgresql://axe_prime:ci_only_password@127.0.0.1:5432/axe_prime
  DATABASE_SSL_MODE: disable
  APP_PUBLIC_URL: http://127.0.0.1:3000
  AUTH_ALLOWED_ORIGINS: http://127.0.0.1:3000

jobs:
  secret-history:
    name: Reject secrets in Git history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan environment-style secrets without printing values
        shell: bash
        run: |
          matches="$(git log --all \
            -G '^[A-Z][A-Z0-9_]*(KEY|SECRET|TOKEN|PASSWORD)=[^[:space:]]{8,}$' \
            --format='%H' -- . ':(exclude)package-lock.json' | sort -u)"
          if [ -n "$matches" ]; then
            echo "::error::Potential credential material exists in Git history. Revoke it and purge the affected objects before release."
            exit 1
          fi

  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run

  supply-chain:
    name: Dependency audit and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Fail on high or critical known vulnerabilities
        run: npm audit --audit-level=high
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

  build-e2e:
    name: Build and browser tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: axe_prime
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: axe_prime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axe_prime -d axe_prime"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Generate ephemeral CI-only authentication keys
        run: |
          echo "JWT_ACCESS_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "AUTH_TOKEN_PEPPER=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Initialize PostgreSQL schema
        run: npm run db:migrate
      - run: npm run build
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
